[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pdftrace"
version = "1.2.0"
description = "PDFTrace: forensic analysis of PDF files (desktop GUI and CLI)"
readme = "README.it.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "PDFTrace contributors" }]
keywords = ["pdf", "forensics", "dfir", "metadata", "fonts", "poppler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pdfplumber>=0.11,<0.12",
    "fonttools>=4.40",
    "pikepdf>=8",
    "pypdf>=4",
    "pypdfium2>=4",
    "Pillow>=10",
    "cryptography>=42",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
build = ["pyinstaller>=6.6"]

[project.scripts]
pdftrace = "pdftrace.cli:main"

[project.gui-scripts]
pdftrace-gui = "pdftrace.gui.app:main"

[project.urls]
Homepage = "https://github.com/OWNER/PDFTrace"
Documentation = "https://github.com/OWNER/PDFTrace#readme"
Issues = "https://github.com/OWNER/PDFTrace/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pdftrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is used in tests
    "S404",   # subprocess is required (list args, no shell)
    "S603",   # idem, audited in integrations/process.py
    "RUF001", # intentional unicode symbols (✓, ⟳, …) in the UI
    "RUF002",
    "RUF003",
    "N802",   # Qt overrides use camelCase
    "N818",
    "SIM118", # pikepdf/fontTools containers need .keys()   # ToolNotFound/ToolFailed read better than *Error here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B018"]

[tool.mypy]
python_version = "3.12"
files = ["src/pdftrace"]
strict = true
warn_unreachable = true
disallow_any_generics = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pdfminer.*", "fontTools.*", "PySide6.*", "pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pdftrace.gui.*"]
disallow_untyped_calls = false
warn_return_any = false
