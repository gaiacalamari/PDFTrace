name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # windows-2022 images include Inno Setup 6 (see actions/runner-images)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,build,dev]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files\7-Zip\7z.exe")) { choco install 7zip -y --no-progress }
      - name: Build portable bundle and installer
        run: python scripts/build_standalone.py --download --zip --installer
      - name: Smoke test of the bundle
        run: |
          dist\PDFTrace\pdftrace-cli.exe --version
          dist\PDFTrace\pdftrace-cli.exe --check
          dist\PDFTrace\tesseract\tesseract.exe --version
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pdftrace-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
